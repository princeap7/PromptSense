<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PromptSense Studio</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #fff;
      --ink: #1c2230;
      --mute: #667085;
      --line: #e4e7ec;
      --acc: #4f46e5;
      --good: #12a26a;
      --warn: #e0892b;
      --bad: #d64545;
      --soft: #f1f3f8
    }

    @media(prefers-color-scheme:dark) {
      :root {
        --bg: #0f1218;
        --card: #181c25;
        --ink: #e8eaf0;
        --mute: #98a1b3;
        --line: #2a3040;
        --acc: #8b86ff;
        --soft: #222735
      }
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.55 system-ui, -apple-system, Segoe UI, Roboto, sans-serif
    }

    .wrap {
      max-width: 1250px;
      margin: 0 auto;
      padding: 22px 18px 60px
    }

    h1 {
      font-size: 22px;
      margin: 0 0 2px
    }

    .sub {
      color: var(--mute);
      margin: 0 0 18px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px
    }

    textarea,
    input,
    select {
      width: 100%;
      font: inherit;
      color: var(--ink);
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 11px
    }

    textarea {
      min-height: 84px;
      resize: vertical
    }

    .row {
      display: grid;
      grid-template-columns: 150px 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
      align-items: end
    }

    label.s {
      font-size: 12px;
      color: var(--mute);
      display: block;
      margin-bottom: 3px
    }

    .opts {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      margin-top: 10px;
      align-items: center;
      color: var(--mute);
      font-size: 13px
    }

    .opts input {
      width: auto;
      margin-right: 6px
    }

    button {
      font: inherit;
      cursor: pointer;
      border: 0;
      border-radius: 10px;
      padding: 10px 20px;
      background: var(--acc);
      color: #fff;
      font-weight: 600;
      margin-left: auto
    }

    button.ghost {
      background: var(--soft);
      color: var(--ink);
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 500;
      margin: 0;
      border: 1px solid var(--line)
    }

    button:disabled {
      opacity: .6;
      cursor: wait
    }

    #err {
      display: none;
      margin-top: 12px;
      color: var(--bad);
      background: color-mix(in srgb, var(--bad) 10%, transparent);
      padding: 10px 12px;
      border-radius: 10px;
      white-space: pre-wrap
    }

    #sum {
      display: none;
      margin: 16px 0;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px
    }

    .stat {
      text-align: center
    }

    .stat small {
      color: var(--mute);
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em
    }

    .stat b {
      font-size: 24px
    }

    .up {
      color: var(--good)
    }

    .down {
      color: var(--bad)
    }

    #note {
      display: none;
      margin: 0 0 12px;
      color: var(--mute);
      font-size: 13px
    }

    #cols {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: start
    }

    .col h2 {
      margin: 0 0 10px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--mute);
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .col.ref {
      border-color: var(--acc)
    }

    .col.ref h2 {
      color: var(--acc)
    }

    .box {
      background: var(--soft);
      border-radius: 10px;
      padding: 11px 13px;
      margin-bottom: 12px;
      white-space: pre-wrap;
      word-break: break-word
    }

    .box.out {
      max-height: 340px;
      overflow: auto;
      font-size: 14px
    }

    .box pre {
      white-space: pre;
      overflow: auto;
      background: var(--card);
      padding: 8px;
      border-radius: 8px;
      margin: 6px 0
    }

    .lbl {
      font-size: 12px;
      color: var(--mute);
      margin: 2px 0 5px;
      font-weight: 600
    }

    .pqs {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px
    }

    .pqs b {
      font-size: 34px
    }

    .pqs span {
      color: var(--mute)
    }

    .bar {
      display: grid;
      grid-template-columns: 118px 1fr 34px;
      gap: 8px;
      align-items: center;
      font-size: 13px;
      margin: 5px 0
    }

    .track {
      height: 8px;
      border-radius: 5px;
      background: var(--soft);
      overflow: hidden
    }

    .track i {
      display: block;
      height: 100%;
      border-radius: 5px
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0
    }

    .chip {
      background: color-mix(in srgb, var(--warn) 16%, transparent);
      color: var(--warn);
      padding: 2px 9px;
      border-radius: 99px;
      font-size: 12px
    }

    ul.rec {
      margin: 4px 0 12px;
      padding-left: 18px;
      font-size: 13px
    }

    ul.rec b {
      text-transform: capitalize
    }

    .sp {
      height: 1px;
      background: var(--line);
      margin: 14px 0
    }

    @media(max-width:820px) {

      #cols,
      #sum {
        grid-template-columns: 1fr
      }

      .row {
        grid-template-columns: 1fr
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>PromptSense</h1>
    <p class="sub">Enter a simple prompt. See the model's answer and PromptSense metrics, next to a refined prompt and
      its answer.</p>

    <div class="card">
      <textarea id="prompt" placeholder="e.g. write a python function for sorting"></textarea>
      <div class="opts">
        <label class="s" style="margin:0;min-width:110px;">MODEL</label>
        <select id="provider" style="max-width:300px;">
          <option value="gemini">Google Gemini</option>
          <option value="qwen">Qwen: Qwen3.8 27B (free)</option>
          <option value="nemotron">NVIDIA Nemotron 3 Ultra (free)</option>
        </select>
        <button id="go">Analyze &amp; Run</button>
      </div>
      <div id="err"></div>
    </div>

    <div id="sum" class="card"></div>
    <p id="note"></p>
    <div id="cols">
      <div class="card col" id="L"></div>
      <div class="card col ref" id="R"></div>
    </div>
  </div>
  <script>
    const $ = s => document.querySelector(s);
    const DIMS = [["clarity", "Clarity"], ["specificity", "Specificity"], ["context", "Context"], ["task_definition", "Task definition"], ["constraints", "Constraints"], ["ambiguity_noise", "Low ambiguity"]];
    const CRIT = [["relevance", "Relevance"], ["clarity", "Clarity"], ["completeness", "Completeness"], ["instruction_adherence", "Instruction adherence"], ["overall_quality", "Overall quality"]];
    const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    const md = s => esc(s).replace(/```(?:\w+)?\n([\s\S]*?)```/g, "<pre>$1</pre>").replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
    const colr = (v, m) => v / m >= .7 ? "var(--good)" : v / m >= .5 ? "var(--warn)" : "var(--bad)";
    const bar = (l, v, t, m = 10) => `<div class="bar" ${t ? `title="${esc(t)}"` : ""}><span>${l}</span><div class="track"><i style="width:${v / m * 100}%;background:${colr(v, m)}"></i></div><b>${v}</b></div>`;
    const sgn = (n, u = "") => (n > 0 ? "+" : "") + n + u;
    const cls = n => n > 0 ? "up" : n < 0 ? "down" : "";

    function column(el, title, r, extra) {
      const a = r.analysis, e = r.eval;
      el.innerHTML = `<h2>${title}${extra.btn || ""}</h2>
   <div class="lbl">PROMPT</div><div class="box">${esc(r.prompt)}</div>
   ${r.output != null ? `<div class="lbl">MODEL OUTPUT</div><div class="box out">${md(r.output)}</div>` : ""}
   <div class="sp"></div>
   <div class="lbl">PROMPTSENSE METRICS · task: ${esc(a.task)}</div>
   <div class="pqs"><b>${a.pqs}</b><span>/ 100 prompt quality (PQS)</span></div>
   ${DIMS.map(([k, l]) => bar(l, a.scores[k].score, a.scores[k].rationale)).join("")}
   ${a.weak.length ? `<div class="chips">${a.weak.map(w => `<span class="chip">weak: ${esc(w)}</span>`).join("")}</div>` : ""}
   ${extra.recs || ""}
   ${e ? `<div class="sp"></div><div class="lbl">OUTPUT SCORE · overall ${e.overall}/5</div>${CRIT.map(([k, l]) => bar(l, e.scores[k], "", 5)).join("")}` : ""}`;
    }

    $("#go").onclick = async () => {
      const btn = $("#go"), err = $("#err"); err.style.display = "none";
      const prompt = $("#prompt").value.trim(); if (!prompt) { err.textContent = "Please enter a prompt."; err.style.display = "block"; return }
      btn.disabled = true; btn.textContent = "Running…";
      try {
        const res = await fetch("/api/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt, provider: ($("#provider") ? $("#provider").value : "gemini") }) });
        const d = await res.json(); if (!res.ok) throw new Error(d.error || res.statusText);
        const o = d.original, r = d.refined, dq = +(r.analysis.pqs - o.analysis.pqs).toFixed(1);
        const verdict = { refined: "Refined wins", original: "Original wins", tie: d.unchanged ? "No change needed" : "Tie" }[d.winner];
        $("#sum").innerHTML = d.outputs ? `<div class="stat"><small>Prompt quality (PQS)</small><b>${o.analysis.pqs} → ${r.analysis.pqs}</b> <span class="${cls(dq)}">${sgn(dq)}</span></div>
      <div class="stat"><small>Output score /5</small><b>${o.eval.overall} → ${r.eval.overall}</b> <span class="${cls(d.delta)}">${sgn(d.delta)}</span></div>
      <div class="stat"><small>Verdict</small><b>${verdict}</b></div>`
          : `<div class="stat"><small>Original PQS</small><b>${o.analysis.pqs}</b></div>
      <div class="stat"><small>Refined PQS</small><b>${r.analysis.pqs}</b></div>
      <div class="stat"><small>Change</small><b class="${cls(dq)}">${sgn(dq)}</b></div>`;
        $("#sum").style.display = "grid";
        const n = $("#note"); n.style.display = "block";
        n.textContent = (d.unchanged ? "Your prompt was already well-formed, so PromptSense left it unchanged. " : "") + (d.outputs ? `Model: ${d.model} · output scores: blind A/B LLM judge (1-5), judged against your original request. ${d.reason || ""}` : "Prompt quality analysis only (PQS, 0-100).");
        const recs = d.recommendations.length ? `<div class="lbl">RECOMMENDATIONS</div><ul class="rec">${d.recommendations.map(x => `<li><b>${esc(x.dimension.replace("_", " "))}:</b> ${esc(x.advice)}</li>`).join("")}</ul>` : "";
        column($("#L"), "Your prompt", o, { recs });
        column($("#R"), "PromptSense refined", r, { btn: `<button class="ghost" id="use">Use as my prompt</button>` });
        $("#cols").style.display = "grid";
        $("#use").onclick = () => { $("#prompt").value = r.prompt; window.scrollTo({ top: 0, behavior: "smooth" }) };
      } catch (e) { err.textContent = e.message; err.style.display = "block" }
      btn.disabled = false; btn.textContent = "Analyze & Run";
    };
    $("#prompt").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("#go").click() });
  </script>
</body>

</html>
